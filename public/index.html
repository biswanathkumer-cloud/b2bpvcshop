<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B2B PVC Shop</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#0f172a;color:white;padding:18px 20px;position:sticky;top:0;z-index:10}.wrap{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#0ea5e9;color:#fff}.dark{background:#1e293b;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding:22px 0}.card{background:white;border-radius:14px;padding:14px;box-shadow:0 3px 15px #0001}.card img{width:100%;height:180px;object-fit:contain;border-radius:10px;background:#f8fafc}.price{font-size:22px;font-weight:800}.mrp{text-decoration:line-through;color:#888;margin-left:7px;font-size:14px}.qty{width:75px;padding:8px}.bar{background:#fff;padding:15px;border-radius:12px;margin:20px 0;box-shadow:0 2px 10px #0001}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:30}.modal.show{display:flex}.box{background:#fff;border-radius:14px;padding:20px;max-width:900px;width:92%;max-height:90vh;overflow:auto}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{padding:10px;border:1px solid #cbd5e1;border-radius:8px;width:100%;box-sizing:border-box}.slab{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin:6px 0}.small{font-size:12px;color:#64748b}.danger{color:#b91c1c}.hide{display:none}.order-item{padding:8px 0;border-bottom:1px solid #e5e7eb}
</style></head><body><header><div class="wrap top"><div><b>West Bengal PVC Smart Card Print Hub</b><div class="small" style="color:#cbd5e1">Simple Guest Checkout</div></div><div class="row"><button class="btn primary" onclick="openCart()">🛒 Cart <span id="cartCount">0</span></button><button class="btn dark" onclick="openOwner()">🔐 Owner Login</button></div></div></header><main class="wrap"><div class="bar"><b>Quantity অনুযায়ী দাম</b><div class="small">আপনার quantity অনুযায়ী Offer Price স্বয়ংক্রিয়ভাবে হিসাব হবে।</div></div><section id="products" class="grid"></section></main>
<div id="cartModal" class="modal"><div class="box"><div class="top"><h2>🛒 Order</h2><button class="btn dark" onclick="closeM('cartModal')">×</button></div><div id="cartLines"></div><hr><h3>Total: ₹<span id="cartTotal">0</span></h3><h3>Customer Details</h3><form onsubmit="submitOrder(event)"><input class="field" id="cname" placeholder="Name" required><br><br><input class="field" id="cphone" placeholder="10-digit Mobile" pattern="[0-9]{10}" required><br><br><textarea class="field" id="caddress" placeholder="Full Address" required></textarea><br><br><input class="field" id="cpin" placeholder="PIN" required><br><br><button class="btn primary" type="submit">💳 Pay Online</button></form><div id="payMsg" class="small"></div></div></div>
<div id="ownerModal" class="modal"><div class="box"><div class="top"><h2>🔐 Owner Login</h2><button class="btn dark" onclick="closeM('ownerModal')">×</button></div><form onsubmit="ownerLogin(event)"><input class="field" id="opass" type="password" placeholder="Owner Password" required><br><br><button class="btn primary">Login</button></form><div id="ownerMsg" class="danger"></div></div></div>
<div id="adminModal" class="modal"><div class="box"><div class="top"><h2>⚙️ Owner Panel</h2><div class="row"><button class="btn dark" onclick="loadAdmin()">Refresh</button><button class="btn" onclick="ownerLogout()">Logout</button></div></div><div class="row" style="margin:10px 0"><button class="btn dark" onclick="loadOrders()">📋 Orders</button></div><div id="adminBody"></div></div></div>
<script src="/products.js"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>
const CART_KEY='b2b_guest_cart_v1';let products=[];let cart=JSON.parse(localStorage.getItem(CART_KEY)||'[]');let owner=false;
const $=id=>document.getElementById(id);const money=n=>Number(n||0).toFixed(0);function closeM(id){$(id).classList.remove('show')}function saveCart(){localStorage.setItem(CART_KEY,JSON.stringify(cart));renderCartCount()}
async function api(path,opt={}){const r=await fetch(path,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function mergeServer(rows){const map=new Map(rows.map(x=>[x.id,x]));products=(window.INITIAL_PRODUCTS||[]).map(p=>Object.assign({},p,map.get(p.id)||{}, {slabs:(map.get(p.id)||{}).slabs||[{min:1,max:null,price:p.price}]}));render()}
async function boot(){try{const d=await api('/api/products');mergeServer(d.products||[])}catch(e){products=(window.INITIAL_PRODUCTS||[]).map(p=>({...p,slabs:[{min:1,max:null,price:p.price}]}));render()}}
function priceFor(p,q){let best=p.price;for(const s of (p.slabs||[])){if(q>=Number(s.min||1)&&(s.max==null||s.max===''||q<=Number(s.max)))best=Number(s.price); }return best}
function render(){const el=$('products');el.innerHTML=products.map(p=>`<article class="card"><img src="${p.images?.[0]||''}" alt=""><h3>${p.title}</h3><div class="small">${p.tag||''}</div><p>${p.desc||''}</p><div class="price">₹<span id="price-${p.id}">${money(priceFor(p,1))}</span><span class="mrp">₹${money(p.normalPrice)}</span></div><div class="row"><label>Qty <input class="qty" id="q-${p.id}" type="number" min="1" value="1" onchange="showPrice('${p.id}')"></label><button class="btn primary" onclick="add('${p.id}')">Add to Cart</button></div></article>`).join('');renderCartCount()}
function showPrice(id){const p=products.find(x=>x.id===id);const q=Math.max(1,Number($('q-'+id).value)||1);$('price-'+id).textContent=money(priceFor(p,q))}
function add(id){const p=products.find(x=>x.id===id),q=Math.max(1,Number($('q-'+id).value)||1),x=cart.find(x=>x.id===id);if(x)x.qty+=q;else cart.push({id,qty:q});saveCart();openCart()}
function renderCartCount(){$('cartCount').textContent=cart.reduce((a,x)=>a+x.qty,0)}
function openCart(){renderCart();$('cartModal').classList.add('show')}function renderCart(){let total=0;$('cartLines').innerHTML=cart.length?cart.map(x=>{const p=products.find(p=>p.id===x.id),unit=priceFor(p,x.qty),sum=unit*x.qty;total+=sum;return `<div class="order-item"><b>${p.title}</b> — Qty ${x.qty} × ₹${money(unit)} = <b>₹${money(sum)}</b> <button class="btn" onclick="removeItem('${x.id}')">Remove</button></div>`}).join(''):'Cart empty';$('cartTotal').textContent=money(total);}
function removeItem(id){cart=cart.filter(x=>x.id!==id);saveCart();renderCart()}
async function submitOrder(e){e.preventDefault();if(!cart.length)return;const items=cart.map(x=>{const p=products.find(p=>p.id===x.id);return {id:p.id,title:p.title,qty:x.qty,unit_price:priceFor(p,x.qty),total:x.qty*priceFor(p,x.qty)}});const total=items.reduce((a,x)=>a+x.total,0);$('payMsg').textContent='Creating secure payment...';try{const d=await api('/api/orders',{method:'POST',body:JSON.stringify({customer:{name:$('cname').value.trim(),phone:$('cphone').value.trim(),address:$('caddress').value.trim(),pin:$('cpin').value.trim()},items,total})});if(d.payment?.enabled&&window.Razorpay){const r=new Razorpay({key:d.payment.key,amount:d.payment.amount,currency:'INR',name:'B2B PVC Shop',order_id:d.payment.order_id,handler:async resp=>{await api('/api/payment/verify',{method:'POST',body:JSON.stringify({order_id:d.payment.order_id,payment_id:resp.razorpay_payment_id,signature:resp.razorpay_signature})});cart=[];saveCart();$('payMsg').textContent='Payment successful. Order ID: '+d.order_no;}});r.open()}else{cart=[];saveCart();$('payMsg').textContent='Order '+d.order_no+' received. Online payment is not configured yet.';}}catch(err){$('payMsg').textContent=err.message}}
function openOwner(){closeM('adminModal');$('ownerModal').classList.add('show')}
async function ownerLogin(e){e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:'owner',password:$('opass').value})});owner=true;closeM('ownerModal');$('adminModal').classList.add('show');loadAdmin()}catch(err){$('ownerMsg').textContent=err.message}}
async function ownerLogout(){try{await api('/api/admin/logout',{method:'POST'});owner=false;closeM('adminModal')}catch{}}
async function loadOrders(){try{const d=await api('/api/admin/orders');$('adminBody').innerHTML='<h3>Recent Orders</h3>'+((d.orders||[]).map(o=>`<div class=\"card\"><b>${o.order_no}</b> — ${o.status} — ₹${money(o.total)}<br>${o.customer_name} | ${o.phone}<br>${o.address||''} ${o.pin||''}<br><span class=\"small\">${o.created_at}</span></div>`).join('')||'No orders')}catch(e){$('adminBody').innerHTML='<p class=\"danger\">'+e.message+'</p>'}}
async function loadAdmin(){try{const d=await api('/api/admin/products');$('adminBody').innerHTML='<p><b>Products & Quantity Slabs</b></p>'+d.products.map(p=>`<div class="card"><b>${p.title}</b><div class="row"><input class="field" style="max-width:140px" id="mrp-${p.id}" value="${p.normalPrice}" type="number" placeholder="MRP"><input class="field" style="max-width:140px" id="base-${p.id}" value="${p.price}" type="number" placeholder="Base Offer"></div><div id="slabs-${p.id}">${(p.slabs||[]).map((s,i)=>slabHtml(p.id,i,s)).join('')}</div><button class="btn" onclick="addSlab('${p.id}')">+ Quantity Slab</button> <button class="btn primary" onclick="saveProduct('${p.id}')">Save Online</button></div>`).join('')}catch(err){$('adminBody').innerHTML='<p class="danger">'+err.message+'</p>'}}
function slabHtml(id,i,s){return `<div class="slab" data-slab="${i}"><input class="field" data-min value="${s.min??1}" type="number" placeholder="Min Qty"><input class="field" data-max value="${s.max??''}" type="number" placeholder="Max Qty"><input class="field" data-price value="${s.price??0}" type="number" placeholder="Offer Price"><button class="btn" onclick="this.parentElement.remove()">×</button></div>`}
function addSlab(id){const c=$('slabs-'+id),i=c.children.length;c.insertAdjacentHTML('beforeend',slabHtml(id,i,{min:1,max:'',price:0}))}
async function saveProduct(id){const c=$('slabs-'+id),slabs=[...c.querySelectorAll('.slab')].map(x=>({min:Number(x.querySelector('[data-min]').value||1),max:x.querySelector('[data-max]').value===''?null:Number(x.querySelector('[data-max]').value),price:Number(x.querySelector('[data-price]').value||0)}));try{await api('/api/admin/products/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({normalPrice:Number($('mrp-'+id).value),price:Number($('base-'+id).value),slabs})});alert('Online update saved');boot()}catch(e){alert(e.message)}}
boot();
</script></body></html>
